[project]
name = "voxscribe"
version = "1.0.0"
description = "VoxScribe 语声成文：本地离线语音转写 + DeepSeek 文本整理"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1.0",
    "requests>=2.31.0",
    "python-docx>=1.1.0",
    "sounddevice>=0.4.6",
    "tkinterdnd2>=0.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
